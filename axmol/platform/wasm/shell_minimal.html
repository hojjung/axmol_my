<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Emscripten-Generated Code</title>
    <style>
      .emscripten { padding-right: 0; margin-left: auto; margin-right: auto; display: block; }
      textarea.emscripten { font-family: monospace; display: inline; width: 100%}
      div.emscripten { margin-left: 0px; text-align: center; }
      div.emscripten_border { margin-left: 0px; border: 1px solid black; }
      /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
      canvas.emscripten { border: 0px none; background-color: black; }

      @-webkit-keyframes rotation {
        from {-webkit-transform: rotate(0deg);}
        to {-webkit-transform: rotate(360deg);}
      }
      @-moz-keyframes rotation {
        from {-moz-transform: rotate(0deg);}
        to {-moz-transform: rotate(360deg);}
      }
      @-o-keyframes rotation {
        from {-o-transform: rotate(0deg);}
        to {-o-transform: rotate(360deg);}
      }
      @keyframes rotation {
        from {transform: rotate(0deg);}
        to {transform: rotate(360deg);}
      }

    </style>
  </head>
  <body>
    <div class="emscripten_border">
      <div class="emscripten" id="status">Downloading...</div>
      <div class="emscripten">
        <progress value="0" max="100" id="progress" hidden=1></progress>
      </div>
      <canvas class="emscripten" id="canvas"  oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    </div>
    <div class="emscripten">
      <input type="checkbox" id="resize">Resize canvas
      <input type="checkbox" id="pointerLock" checked>Lock/hide mouse pointer
      &nbsp;&nbsp;&nbsp;
      <input type="button" value="Fullscreen" onclick="Module.requestFullscreen(document.getElementById('pointerLock').checked,
                                                                                document.getElementById('resize').checked)">
      |
      <input type="button" value="Pause" onclick="Module.ccall('axmol_dev_pause')">
      <input type="button" value="Resume" onclick="Module.ccall('axmol_dev_resume')">
      <input type="button" value="Step" onclick="Module.ccall('axmol_dev_step')">
    </div>

    <div class="emscripten">
      <textarea class="emscripten" id="output" rows="8"></textarea>
    </div>

    <script type='text/javascript'>
      var statusElement = document.getElementById('status');
      var progressElement = document.getElementById('progress');

      var hierarchyElement = document.getElementById('hierarchy');
      var nodeProperties = [];
      for(var i = 0; i < 20; i++) {
        nodeProperties[i] = document.getElementById('nodeProperty' + i);
      }
      var Module = {
        preInit: [],
        preRun: [],
        postRun: [],
        print: (function() {
          // #region axmol-spec
          var escapeDeep = 0;
          var stashedEscape = null;
          // #endregion axmol-spec
          var element = document.getElementById('output');
          if (element) element.value = ''; // clear browser cache
          return function(text) {
            if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
            // These replacements are necessary if you render to raw HTML
            //text = text.replace(/&/g, "&amp;");
            //text = text.replace(/</g, "&lt;");
            //text = text.replace(/>/g, "&gt;");
            //text = text.replace('\n', '<br>', 'g');

            // #region axmol-spec
            var curEscape = null;
            var escapeList = text.match(/\x1b\[(\d{2})?m/g);
            if(escapeList != null) {
              for(var i = 0; i < escapeList.length; ++i) {
                var escape = escapeList[i];
                if (escape !== "\x1b[m") {
                  curEscape = escape;
                  ++escapeDeep;
                } else {
                  --escapeDeep;
                }
              }
            }
            if (escapeDeep > 0) { // still in escape
              if (stashedEscape != null) { // check stashedEscape
                if(text.startsWith("\x1b[m")) {
                  text = text.substring(3);
                }
                if (!text.startsWith("\x1b[")) { // due to end color removed, it's must start color or not.
                  text = stashedEscape + text;
                }
              }

              if(curEscape) {
                // store this text last escape
                stashedEscape = curEscape;
              }
            } else {
              stashedEscape = null;
            }
            /* trim end: (\n)?\x1b[m */
            if(text.endsWith("\n\x1b[m")) {
              text = text.substring(0, text.length - 4);
            }
            else if(text.endsWith("\x1b[m")) {
              text = text.substring(0, text.length - 3);
            }
            // #endregion axmol-spec

            console.log(text);
            if (element) {
              element.value += text.replace(/\x1b\[(\d{2})?m/g, '') + "\n"; // axmol-mod: strip ansi color
              element.scrollTop = element.scrollHeight; // focus on bottom
            }
          };
        })(),
        printErr: function(text) {
          if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
          console.error(text);
        },
        canvas: (function() {
          var canvas = document.getElementById('canvas');

          // Prevent the browser from discarding the context permanently. Axmol
          // rebuilds renderer resources from axmol_webglcontextrestored().
          window.axmolContextRecovery = { lost: 0, restored: 0 };
          function updateContextRecoveryState() {
            var lost = String(window.axmolContextRecovery.lost);
            var restored = String(window.axmolContextRecovery.restored);
            canvas.setAttribute('data-axmol-context-lost', lost);
            canvas.setAttribute('data-axmol-context-restored', restored);
            document.documentElement.setAttribute('data-axmol-context-lost', lost);
            document.documentElement.setAttribute('data-axmol-context-restored', restored);
          }
          updateContextRecoveryState();
          canvas.addEventListener("webglcontextlost", function(e) {
            e.preventDefault();
            window.axmolContextRecovery.lost++;
            updateContextRecoveryState();
            Module.setStatus('WebGL context lost; rebuilding...');
            Module.ccall('axmol_webglcontextlost', null, [], []);
          }, false);
          canvas.addEventListener("webglcontextrestored", function(e) {
            e.preventDefault();
            Module.ccall('axmol_webglcontextrestored', null, [], []);
            window.axmolContextRecovery.restored++;
            updateContextRecoveryState();
            Module.setStatus('WebGL context restored');
          }, false);

          document.addEventListener("visibilitychange", () => {
            Module.ccall('axmol_hdoc_visibilitychange', null, ['number'], [document.hidden ? 1 : 0]);
          });

          return canvas;
        })(),
        setStatus: function(text) {
          if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
          if (text === Module.setStatus.last.text) return;
          var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var now = Date.now();
          if (m && now - Module.setStatus.last.time < 30) return; // if this is a progress update, skip it if too soon
          Module.setStatus.last.time = now;
          Module.setStatus.last.text = text;
          if (m) {
            text = m[1];
            progressElement.value = parseInt(m[2])*100;
            progressElement.max = parseInt(m[4])*100;
            progressElement.hidden = false;
          } else {
            progressElement.value = null;
            progressElement.max = null;
            progressElement.hidden = true;
          }
          statusElement.innerHTML = text;
        },
        totalDependencies: 0,
        monitorRunDependencies: function(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
        }
      };
      Module.setStatus('Downloading...');
      var reportingWindowError = false;
      window.onerror = function(message, source, line, column, error) {
        if (reportingWindowError) return false;
        reportingWindowError = true;
        var detail = '[window.onerror] ' + String(message) + ' @ ' +
                     (source || '<unknown>') + ':' + (line || 0) + ':' + (column || 0);
        try {
          Module.printErr(detail);
          if (error && error.stack) Module.printErr(error.stack);
        } catch (reportingError) {
          console.error(detail);
          console.error(error && error.stack ? error.stack : reportingError);
        }
        Module.setStatus('Exception thrown, see JavaScript console');
        Module.setStatus = function(text) {
          if (text) Module.printErr('[post-exception status] ' + text);
        };
        reportingWindowError = false;
        return false;
      };
    </script>
    <script type='text/javascript'>
      Module.postRun.push(function() {
        if (new URLSearchParams(window.location.search).get('context-loss-test') !== '1') return;
        var context = Module.canvas.getContext('webgl2');
        var extension = context && context.getExtension('WEBGL_lose_context');
        if (!extension) {
          Module.printErr('WEBGL_lose_context is unavailable; context restore smoke skipped');
          return;
        }
        setTimeout(function() {
          extension.loseContext();
          setTimeout(function() { extension.restoreContext(); }, 1000);
        }, 1000);
      })
    </script>
#if PTHREADS
    <script>
      (function() {
        document.documentElement.dataset.axmolCrossOriginIsolated =
          (window.crossOriginIsolated === true && typeof SharedArrayBuffer !== 'undefined') ? '1' : '0';
        if (window.crossOriginIsolated === true && typeof SharedArrayBuffer !== 'undefined') return;
        var message = 'This Axmol build uses WebAssembly threads and requires cross-origin isolation. ' +
                      'Serve COOP: same-origin and COEP: require-corp (or credentialless), ' +
                      'or rebuild with -DAX_WASM_THREADS=0.';
        window.axmolPthreadPreflightFailed = true;
        Module.setStatus(message);
        Module.printErr(message);
        window.stop();
      })();
    </script>
#endif
    {{{ SCRIPT }}}
  </body>
</html>
